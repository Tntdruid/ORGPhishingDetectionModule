# Eksempel: tilføj LOCAL_FUZZY_ORG (flag 6) til din eksisterende "local"-regel
# i local.d/fuzzy_check.conf. Brug et flag, der ikke allerede er i brug.
#
# Holdes adskilt fra LOCAL_FUZZY_DENIED, så automatisk lærte hashes kan vægtes
# for sig og ryddes uden at røre manuelt tilføjede hashes.

rule "local" {
  # ... dine eksisterende indstillinger (servers, algorithm, mime_types osv.) ...
  fuzzy_map = {
    # ... LOCAL_FUZZY_DENIED (1), LOCAL_FUZZY_PROB (2), LOCAL_FUZZY_WHITE (3) ...
    LOCAL_FUZZY_ORG {
      flag = 6;
      max_score = 10;
    }
  }
}

