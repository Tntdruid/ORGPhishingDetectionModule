# Eksempel: local.d/metadata_exporter.conf
#
# Lægger mails, som ORG_PHISHING selv afviser (markøren ORG_PHISHING_REJECTED),
# automatisk i den lokale fuzzy-lagring under flag 6 (LOCAL_FUZZY_ORG).
# Gentagelser af samme kampagneskabelon rammer derefter fuzzy med det samme.
#
# Ret stien til controller-socket'en, så den passer til din installation
# (DirectAdmin bruger typisk en unix-socket). Kræver controlleren password
# på socket'en, så tilføj -P <password> til kommandoen.

custom_select {
  org_phishing_rejected = <<EOD
return function(task)
  return task:has_symbol('ORG_PHISHING_REJECTED')
end
EOD;
}

rules {
  ORG_PHISHING_FUZZY {
    backend = "pipe";
    cmd = "/usr/bin/rspamc -h /var/run/rspamd/rspamd.sock fuzzy_add -f 6 -w 10";
    selector = "org_phishing_rejected";
    formatter = "default";
  }
}
